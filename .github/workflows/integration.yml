name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint backend
        run: python -m ruff check app tests
      - name: Check backend formatting
        run: python -m ruff format --check app tests
      - name: Run default backend tests
        working-directory: backend
        run: python -m pytest -q --junitxml=backend-unit.xml --cov=app --cov-report=xml --cov-report=term
      - name: Upload backend test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-summary-${{ matrix.os }}
          path: |
            backend/backend-unit.xml
            backend/coverage.xml
          if-no-files-found: error

  eval-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate all evaluation cases without a model
        working-directory: backend
        run: python -m tests.evals.cli validate-suite --expected-count 24
      - name: Test evaluation infrastructure
        working-directory: backend
        run: python -m pytest tests/evals -q --junitxml=eval-harness.xml
      - name: Upload evaluation test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-harness-summary
          path: backend/eval-harness.xml
          if-no-files-found: error

  eval-regression-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify fail-closed regression fixtures
        working-directory: backend
        run: |
          python -m tests.evals.check_regression --report tests/evals/fixtures/reports/passing.json
          if python -m tests.evals.check_regression --report tests/evals/fixtures/reports/threshold-regression.json; then exit 1; fi
          if python -m tests.evals.check_regression --report tests/evals/fixtures/reports/missing-category.json; then exit 1; fi
          if python -m tests.evals.check_regression --report tests/evals/fixtures/reports/runtime-error.json; then exit 1; fi
          if python -m tests.evals.check_regression --report tests/evals/fixtures/reports/legacy.json; then exit 1; fi
      - name: Build sanitized smoke evidence
        working-directory: backend
        run: >-
          python -m tests.evals.cli promote-baseline
          --report tests/evals/fixtures/reports/passing.json
          --baseline-id ci-smoke
          --benchmarks-root "${RUNNER_TEMP}/benchmarks"
      - name: Upload sanitized smoke report
        uses: actions/upload-artifact@v4
        with:
          name: eval-regression-smoke
          path: ${{ runner.temp }}/benchmarks/baselines/ci-smoke
          if-no-files-found: error

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  landing-page-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - name: Install landing page dependencies
        run: npm ci
      - name: Build landing page
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: |
          cp .env.docker.example .env.docker
          docker compose config -q
      - name: Build backend image
        run: docker compose build backend
