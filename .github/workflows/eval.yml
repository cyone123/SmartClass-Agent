name: Agent Evaluation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartclass_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartclass_eval
      MODEL: ${{ secrets.EVAL_MODEL }}
      API_KEY: ${{ secrets.EVAL_API_KEY }}
      BASE_URL: ${{ secrets.EVAL_BASE_URL }}
      STRUCTURED_MODEL: ${{ secrets.EVAL_MODEL }}
      STRUCTURED_API_KEY: ${{ secrets.EVAL_API_KEY }}
      STRUCTURED_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
      SMALL_MODEL: ${{ secrets.EVAL_MODEL }}
      SMALL_API_KEY: ${{ secrets.EVAL_API_KEY }}
      SMALL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
      STRUCTURED_FAST_MODEL: ${{ secrets.EVAL_MODEL }}
      STRUCTURED_FAST_API_KEY: ${{ secrets.EVAL_API_KEY }}
      STRUCTURED_FAST_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
      STT_MODEL: ${{ secrets.EVAL_MODEL }}
      STT_API_KEY: ${{ secrets.EVAL_API_KEY }}
      STT_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
      PROMETHEUS_ENABLED: "false"
      OBSERVABILITY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check model evaluation configuration
        id: model-config
        shell: bash
        run: |
          if [[ -n "$MODEL" && -n "$API_KEY" && -n "$BASE_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live evaluation skipped. Configure EVAL_MODEL, EVAL_API_KEY and EVAL_BASE_URL in the monorepo secrets."
          fi
      - name: Install evaluation dependencies
        if: steps.model-config.outputs.configured == 'true'
        run: pip install -r requirements.txt
      - name: Run eval suite
        if: steps.model-config.outputs.configured == 'true'
        run: python -m tests.evals.cli run
      - name: Regression gate
        if: steps.model-config.outputs.configured == 'true'
        run: python -m tests.evals.check_regression
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always() && steps.model-config.outputs.configured == 'true'
        with:
          name: eval-report-${{ github.run_number }}
          path: backend/tests/evals/results/eval_*.json
          retention-days: 90
