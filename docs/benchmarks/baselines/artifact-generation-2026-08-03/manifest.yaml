limitations:
- Synthetic five-case benchmark; it does not represent production traffic.
- OnlyOffice and LibreOffice visual rendering were unavailable and are excluded.
- PPTX and DOCX are validated through OOXML ZIP/XML/schema and parser checks, not
  visual overflow inspection.
- HTML JavaScript receives static syntax and interaction-structure checks, not a full
  browser automation pass.
- Quality scores are deterministic rubric scores and are not human ratings.
