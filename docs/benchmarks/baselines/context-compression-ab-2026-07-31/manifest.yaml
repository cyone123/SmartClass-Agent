  os: Windows-11-10.0.26100-SP0
  python: 3.13.0
limitations:
- Synthetic long-thread benchmark; it does not represent production traffic.
- Main prompt and compression overhead tokens use the production characters/4 fallback
  because the Qwen tokenizer is unavailable locally.
- Main Agent responses are deterministic fixtures; only context summaries invoke the
  live model.
- Latency includes the configured remote model endpoint, timeout attempts, and local
  orchestration.
