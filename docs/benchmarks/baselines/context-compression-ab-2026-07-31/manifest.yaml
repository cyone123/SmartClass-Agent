metric_definitions:
  main_prompt_token_reduction_pct: 1 - treatment cumulative prompt estimate / control
  net_estimated_token_reduction_pct: 1 - (treatment cumulative prompt estimate + compression
    estimated overhead) / control
  compression_latency_ms_p95: nearest-rank p95 of all live compression attempts, including
    failures
  fact_recall_pct: matched predefined synthetic fact groups / expected fact groups
  failure_fallback_preserved_pct: failed attempts that left the complete message state
    unchanged / failures
